<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furniture workspace</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><strong>Furniture workspace</strong><nav><button data-tab="assembly" aria-pressed="true">Assembly</button><button data-tab="plans">Cutting plans</button><button data-tab="files">Exported files</button></nav><span>Millimetres · published design</span></header><div id="status" role="status">Loading published design…</div>
<main><aside id="assembly-panel"><h2>Geometry source</h2><div class="buttons"><button id="python">Use Python parts</button><button id="dxf">Use DXF parts</button></div><p id="source-note"></p><details><summary>DXF comparison findings</summary><pre id="report">Loading report…</pre></details><label>Opacity <output id="alpha-value"></output><input id="alpha" type="range" min="0.1" max="1" step="0.01"></label><label><input id="edges" type="checkbox" checked> Show edges</label><h2>Positions</h2><div id="sliders"></div><h2>Visible parts</h2><div class="buttons"><button id="expand">Expand all</button><button id="collapse">Collapse all</button></div><div id="tree"></div></aside>
<aside id="files-panel" hidden><label>Find exported file<input id="filter" type="search" placeholder="Part, material or format"></label><p id="file-count"></p><div id="file-list"></div></aside>
<section id="viewport"><div id="canvas"></div><button id="fit">Fit view</button><div id="file-toolbar" hidden><a id="download" download>Download original</a><label>Opacity <input id="file-alpha" type="range" min="0.1" max="1" step="0.01" value="1"></label></div><div id="document" hidden></div><div id="dxf-view" hidden><div id="dxf-tools"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-fit">Fit DXF</button><span id="zoom-value"></span><details><summary>Layers</summary><div class="buttons"><button id="layers-all">Show all</button><button id="layers-none">Hide all</button></div><div id="layers"></div></details></div><div id="drawing"></div><div id="scale"><div id="scale-bar"></div><span id="scale-label"></span></div></div></section>
<section id="plans" hidden></section></main><footer id="build-info"></footer><script type="module" src="app.js?v=opacity-3"></script></body></html>
